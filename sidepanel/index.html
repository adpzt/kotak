<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kotak</title>
    <script type="module" crossorigin src="/assets/sidepanel-CnNkci-b.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="modulepreload" crossorigin href="/assets/inbox-DHpH7Nby.js">
    <link rel="stylesheet" crossorigin href="/assets/sidepanel-BYLg4w8g.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__row">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">Kotak</span>
          <span class="brand__version" id="version"></span>
        </div>
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Modules"></nav>
    </header>

    <main class="content module" id="mod-convert" data-module="convert">
      <section class="dropzone" id="dropzone"></section>
      <section class="card preview" id="preview" hidden></section>
      <section class="card settings" id="settings">
        <div class="section__head">
          <h2 class="section__title">Réglages</h2>
          <div class="presets" id="presets"></div>
        </div>
      </section>
      <div class="preset-form-host" id="preset-form"></div>
      <section class="card queue-card" id="queue" hidden></section>
    </main>

    <main class="content module" id="mod-colors" data-module="colors" hidden></main>
    <main class="content module" id="mod-grab" data-module="grab" hidden></main>
    <main class="content module" id="mod-media" data-module="media" hidden></main>

    <footer class="footer" id="footer" hidden></footer>
    <footer class="footer" id="grab-footer" hidden></footer>

  </body>
</html>
